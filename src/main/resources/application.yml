server:
  port: 8080

spring:
  application:
    name: evops-base
  profiles:
    active: dev
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
  datasource:
    url: jdbc:h2:file:./data/evops;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.evops
  configuration:
    map-underscore-to-camel-case: true

# 与卫星轨迹核算平台的每日对账
evops:
  recon:
    # 定时勾稽：每天 06:00 对前一日的账（T+1）
    cron: "0 0 6 * * ?"
    # 新引擎匹配容差（亩）：|本侧-对方| ≤ 容差算平
    tolerance-area: 0.05
    # 并跑期出正式差异清单的引擎：LEGACY / TOLERANCE；连续两天 compare.identical=1 后切 TOLERANCE
    active-engine: LEGACY

logging:
  level:
    com.evops: INFO
